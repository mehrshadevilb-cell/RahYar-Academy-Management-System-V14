[alembic]
script_location = alembic
prepend_sys_path = .

# sqlalchemy.url is intentionally left blank - env.py sets it at runtime
# from src.core.config.settings.get_settings().DATABASE_URL, so DATABASE_URL
# in .env stays the single source of truth for the connection string
# instead of being duplicated here.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0f1419" />
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <style>
    /* RahYar web UI is intentionally dark-only. Explicitly locking the
       browser color scheme prevents OS/browser light-mode overrides from
       changing native controls, inputs, scrollbars, or form rendering. */
    :root {
      color-scheme: dark;
      --bg: #0f1419;
      --bg-deep: #0a0e13;
      --card: #1a2332;
      --card-hover: #202c3d;
      --text: #f2f5f8;
      --muted: #9aa8b8;
      --accent: #3d9cf0;
      --accent-hover: #64b2ff;
      --accent2: #5ecf9a;
      --border: #2a3648;
      --border-strong: #3a4a61;
      --input: #0d121a;
      --focus: rgba(61, 156, 240, .32);
    }

    html {
      color-scheme: dark;
      background: var(--bg-deep);
      -webkit-text-size-adjust: 100%;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Tahoma, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at top, #1a2740 0%, var(--bg) 55%, var(--bg-deep) 100%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.7;
      color-scheme: dark;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); text-decoration: underline; }

    button, input, textarea, select {
      font: inherit;
      color-scheme: dark;
    }

    .wrap {
      width: min(960px, 100%);
      margin: 0 auto;
      padding: 1.25rem;
    }

    header {
      display: flex; flex-wrap: wrap; gap: .75rem;
      align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem; margin-bottom: 1.5rem;
    }

    .brand { font-weight: 700; font-size: 1.15rem; color: var(--text); }

    nav { display: flex; flex-wrap: wrap; gap: .9rem; }
    nav a { color: var(--muted); }
    nav a:hover { color: var(--text); }

    .hero {
      background: linear-gradient(135deg, #1e3a5f, #152033);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem;
      margin-bottom: 1.5rem;
    }

    .hero h1 { margin: 0 0 .5rem; font-size: 1.6rem; }
    .hero p { margin: 0; color: var(--muted); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.1rem;
      display: flex; flex-direction: column; gap: .5rem;
      transition: border-color .15s ease, background-color .15s ease;
    }

    .card:hover {
      background: var(--card-hover);
      border-color: var(--border-strong);
    }

    .card h3 { margin: 0; font-size: 1.05rem; }
    .price { color: var(--accent2); font-weight: 700; }
    .muted { color: var(--muted); font-size: .92rem; }

    .btn {
      display: inline-block;
      background: var(--accent);
      color: #041018 !important;
      font-weight: 700;
      padding: .55rem 1rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      text-decoration: none !important;
    }

    .btn:hover { background: var(--accent-hover); }
    .btn:focus-visible,
    a:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      box-shadow: 0 0 0 4px var(--focus);
    }

    .btn.secondary {
      background: transparent;
      color: var(--text) !important;
      border: 1px solid var(--border);
    }

    .btn.secondary:hover { background: var(--card-hover); }
    .btn-row { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: .75rem; }

    form label {
      display: block;
      margin: .6rem 0 .25rem;
      color: var(--muted);
      font-size: .9rem;
    }

    form input, form textarea, form select {
      width: 100%;
      padding: .65rem .75rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
    }

    form input::placeholder,
    form textarea::placeholder { color: #718095; }

    form textarea { min-height: 90px; resize: vertical; }

    footer {
      margin-top: 2.5rem; padding-top: 1rem;
      border-top: 1px solid var(--border);
      color: var(--muted); font-size: .9rem;
    }

    .notice {
      background: #13261f; border: 1px solid #2a5a45;
      border-radius: 12px; padding: 1rem; margin: 1rem 0;
    }

    @media (max-width: 640px) {
      .wrap { padding: .9rem; }
      header { align-items: flex-start; }
      nav { width: 100%; gap: .65rem .9rem; }
      .hero { padding: 1.25rem; }
      .hero h1 { font-size: 1.35rem; }
      .grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="/">{{ site_name }}</a>
      <nav>
        <a href="/">خانه</a>
        <a href="/products">دوره‌های دیجیتال</a>
        <a href="/classes">کلاس آنلاین</a>
        {% if bot_link %}<a href="{{ bot_link }}" target="_blank" rel="noopener">ربات تلگرام</a>{% endif %}
      </nav>
    </header>
    {% block content %}{% endblock %}
    <footer>
      {{ site_name }} — فروش آنلاین و ربات تلگرام از یک سیستم مشترک استفاده می‌کنند.
      {% if bot_link %} · <a href="{{ bot_link }}" target="_blank" rel="noopener">ورود به ربات</a>{% endif %}
    </footer>
  </div>
</body>
</html>

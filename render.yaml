# RahYar Academy — Render Blueprint
#
# Deploy: Dashboard → New → Blueprint → connect this repo.
# After create, fill sync:false secrets in the dashboard.
#
# Important:
# - Use a paid/always-on web plan (Free sleeps; bot stops polling).
# - Keep a single web instance (Telegram long-polling is not multi-replica safe).
# - AI agent stays disabled on Render.
# - Same service serves Telegram bot + public sales website.

services:
  - type: web
    name: rahyar-bot
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    # Dockerfile CMD already runs: alembic upgrade head && python -m src.main
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: OWNER_ID
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rahyar-db
          property: connectionString
      - key: SPOTPLAYER_API_KEY
        sync: false
      - key: DEFAULT_CARD_NUMBER
        sync: false
      - key: DEFAULT_CARD_HOLDER
        sync: false
      - key: SITE_NAME
        value: "آکادمی راه‌یار"
      - key: DEBUG
        value: "false"
      - key: AI_AGENT_ENABLED
        value: "false"

databases:
  - name: rahyar-db
    plan: basic-256mb
    region: frankfurt
    databaseName: rahyar
    user: rahyar

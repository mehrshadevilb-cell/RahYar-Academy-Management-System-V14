[project]
name = "rahyar-academy"
version = "0.1.0"
description = "RahYar Academy Telegram LMS and CRM System"
requires-python = ">=3.13"
dependencies = [
    "SQLAlchemy==2.0.51",
    "aiogram==3.29.1",
    "alembic==1.14.1",
    "fastapi",
    "uvicorn",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "psycopg[binary]==3.2.10",
    "redis",
    "passlib[bcrypt]==1.7.4",
    "loguru==0.7.3",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = [
    "src"
]
